
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Exam Portal</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1e293b;
        }

        header {
            background: #243b80;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h2 { margin: 0; }

        nav { display: flex; gap: 12px; }

        nav a {
            padding: 10px 17px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            background: white;
            color: #243b80;
        }

        nav a.register {
            background: #16a34a;
            color: white;
        }

        main {
            max-width: 1000px;
            margin: 70px auto;
            padding: 20px;
            text-align: center;
        }

        .hero {
            background: white;
            padding: 55px 25px;
            border-radius: 14px;
            box-shadow: 0 3px 12px #0000000d;
        }

        .hero h1 {
            color: #243b80;
            font-size: 36px;
        }

        .hero p {
            color: #64748b;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            margin: 15px 7px 0;
            padding: 13px 22px;
            background: #243b80;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .button.register {
            background: #16a34a;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 28px; }
            main { margin-top: 30px; }
        }
    </style>
</head>
<body>

<header>
    <h2>Online Exam Portal</h2>
    <nav>
        <a th:href="@{/login}">Login</a>
        <a class="register" th:href="@{/register}">Register</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>Welcome to the Online Exam Portal</h1>
        <p>
            Prepare for your examinations, answer multiple-choice questions,
            and review your results in one convenient place.
        </p>

        <a class="button" th:href="@{/login}">Login to Continue</a>
        <a class="button register" th:href="@{/register}">Create an Account</a>
    </section>
</main>

<footer>
    Online Exam Portal &copy; 2026
</footer>

</body>
</html>
